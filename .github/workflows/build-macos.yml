name: Build macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tkinter
        run: /usr/bin/python3 -c "import tkinter; print('tkinter OK')"

      - name: Install PyInstaller
        run: |
          PY_BIN="python3"
          for py in /usr/local/bin/python3 /opt/homebrew/bin/python3 python3; do
            if command -v "$py" >/dev/null 2>&1; then PY_BIN="$py"; break; fi
          done
          echo "Build script will use: $PY_BIN"
          "$PY_BIN" -m pip install --user -q pyinstaller || "$PY_BIN" -m pip install --user -q --break-system-packages pyinstaller
          "$PY_BIN" -m PyInstaller --version

      - name: Build
        run: bash build_app.sh

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOTA-Watchdog-macOS
          path: IOTA-Watchdog-macOS.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IOTA-Watchdog-macOS.zip
          generate_release_notes: true
