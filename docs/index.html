<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IOTA // CLUSTER MONITOR</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'SF Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    /* 主题设计系统 (Linear / Vercel 极简现代风格) */
    :root, [data-theme="light"] {
      --bg: #F4F6FA;
      --card: #FFFFFF;
      --card-sub: #F8FAFC;
      --border: #E6E9F0;
      --border-hover: #CBD5E1;
      --ink: #141A26;
      --ink-2: #5A6577;
      --ink-3: #8B94A7;
      --indigo: #4F46E5;
      --indigo-soft: #ECEEFE;
      --green: #0E9F6E;
      --green-soft: #E3F6EE;
      --amber: #C77414;
      --amber-soft: #FDF0DC;
      --red: #E02424;
      --red-soft: #FDE8E8;
      --shadow: 0 1px 3px rgba(16, 24, 40, 0.05), 0 1px 2px rgba(16, 24, 40, 0.03);
      --shadow-hover: 0 6px 12px -2px rgba(16, 24, 40, 0.06), 0 3px 6px -3px rgba(16, 24, 40, 0.04);
      --terminal-bg: #0F172A;
      --terminal-fg: #F8FAFC;
      --terminal-border: #1E293B;
      --nav-bg: rgba(255, 255, 255, 0.88);
      --bar-track: #EEF2F6;
    }

    [data-theme="dark"] {
      --bg: #0B0D13;
      --card: #12151F;
      --card-sub: #171B26;
      --border: #222839;
      --border-hover: #323A50;
      --ink: #EDEFF5;
      --ink-2: #9AA3B5;
      --ink-3: #626C82;
      --indigo: #8B93F8;
      --indigo-soft: rgba(139, 147, 248, 0.14);
      --green: #3DD598;
      --green-soft: rgba(61, 213, 152, 0.14);
      --amber: #F5A524;
      --amber-soft: rgba(245, 165, 36, 0.14);
      --red: #F87171;
      --red-soft: rgba(248, 113, 113, 0.14);
      --shadow: none;
      --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.4);
      --terminal-bg: #07090E;
      --terminal-fg: #E2E8F0;
      --terminal-border: #1E2433;
      --nav-bg: rgba(18, 21, 31, 0.88);
      --bar-track: #1C2230;
    }

    [data-theme="midnight-neon"] {
      --bg: #040711;
      --card: rgba(8, 13, 26, 0.95);
      --card-sub: #070B16;
      --border: rgba(0, 242, 254, 0.25);
      --border-hover: rgba(0, 242, 254, 0.5);
      --ink: #FFFFFF;
      --ink-2: #94A3B8;
      --ink-3: #64748B;
      --indigo: #00F2FE;
      --indigo-soft: rgba(0, 242, 254, 0.15);
      --green: #00FF9D;
      --green-soft: rgba(0, 255, 157, 0.15);
      --amber: #FFAA00;
      --amber-soft: rgba(255, 170, 0, 0.15);
      --red: #FF0055;
      --red-soft: rgba(255, 0, 85, 0.15);
      --shadow: 0 0 15px rgba(0, 242, 254, 0.12);
      --shadow-hover: 0 0 25px rgba(0, 242, 254, 0.22);
      --terminal-bg: #03060F;
      --terminal-fg: #00F2FE;
      --terminal-border: rgba(0, 242, 254, 0.35);
      --nav-bg: rgba(7, 11, 22, 0.92);
      --bar-track: rgba(0, 242, 254, 0.08);
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      transition: background-color 0.2s ease, color 0.2s ease;
      font-size: 14px;
      line-height: 1.5;
    }

    .ui-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ui-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-hover);
    }

    .ui-btn {
      transition: all 0.15s ease;
      border-radius: 8px;
    }
    .ui-btn:hover {
      filter: brightness(0.96);
    }
    [data-theme="dark"] .ui-btn:hover,
    [data-theme="midnight-neon"] .ui-btn:hover {
      filter: brightness(1.15);
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--indigo);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-[var(--border)] bg-[var(--card)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
      <h1 class="text-[17px] sm:text-[18px] font-bold text-[var(--ink)] tracking-tight">IOTA // WATCHDOG</h1>
      <div class="flex items-center p-0.5 rounded-lg bg-[var(--card-sub)] border border-[var(--border)]">
        <button onclick="setTheme('light')" id="theme-btn-light" title="浅色模式" class="px-2.5 py-1 rounded-md transition-all flex items-center gap-1"><span>☀️</span><span class="hidden sm:inline">浅色</span></button>
        <button onclick="setTheme('dark')" id="theme-btn-dark" title="深色模式" class="px-2.5 py-1 rounded-md transition-all flex items-center gap-1"><span>🌙</span><span class="hidden sm:inline">深色</span></button>
        <button onclick="setTheme('midnight-neon')" id="theme-btn-midnight-neon" title="霓虹模式" class="px-2.5 py-1 rounded-md transition-all flex items-center gap-1"><span>⚡</span><span class="hidden sm:inline">霓虹</span></button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    <!-- ================= LIVE 实时遥测 (官方 API) ================= -->
    <div id="live-telemetry" class="p-4 rounded-2xl bg-[var(--card)] border border-[var(--border)] shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
        <div class="flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-[var(--green)] animate-pulse" id="live-dot"></span>
          <span class="font-bold text-[15px] text-[var(--ink)]">LIVE 实时遥测</span>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-[var(--indigo-soft)] text-[var(--indigo)] font-mono">OFFICIAL API</span>
          <span class="text-[11px] px-2 py-0.5 rounded-full bg-[var(--green)]/15 text-[var(--green)] font-mono">AES-256</span>
        </div>
        <div class="flex items-center gap-4 font-mono text-[12px] text-[var(--ink-2)]">
          <span>距结算 <span id="live-countdown" class="text-[var(--ink)] font-semibold">--:--:--</span></span>
          <span>数据 <span id="live-updated" class="text-[var(--ink)]">—</span></span>
          <span>刷新 15s</span>
        </div>
      </div>

      <div id="live-locked" class="hidden py-1.5 flex flex-wrap items-center gap-2">
        <span class="text-[12px] text-[var(--ink-2)]">🔐 实时遥测已加密，输入页面密码解锁：</span>
        <input type="password" id="live-pwd" placeholder="页面密码" class="bg-[var(--card-sub)] border border-[var(--border)] rounded-lg px-2.5 py-1.5 text-[12px] text-[var(--ink)] font-mono focus:outline-none focus:border-[var(--indigo)] w-40">
        <button id="live-unlock-btn" class="px-3 py-1.5 rounded-lg bg-[var(--indigo)] text-white text-[12px] font-medium">解锁</button>
        <span id="live-lock-hint" class="text-[11px] text-[var(--ink-3)]"></span>
      </div>

      <div id="live-loading" class="py-1.5 text-[12px] text-[var(--ink-3)] font-mono">正在拉取实时遥测…</div>

      <div id="live-body" class="hidden">
        <div class="text-[10px] font-semibold tracking-wide text-[var(--ink-3)] mb-1">我的矿机</div>
        <div id="live-machines" class="mb-3 rounded-xl border border-[var(--border)] bg-[var(--card-sub)] divide-y divide-[var(--border)]"></div>
        <div class="text-[10px] font-semibold tracking-wide text-[var(--ink-3)] mb-1.5">全部 RUN · 每个 RUN 的矿工数</div>
        <div id="live-cards" class="grid grid-cols-2 lg:grid-cols-4 gap-2.5 mb-3"></div>
        <div class="mt-2 text-[11px] text-[var(--ink-3)] font-mono">来源：Macrocosmos 官方 API · Actions 约每 5 分钟更新，页面每 15 秒刷新</div>
      </div>
    </div>
  </main>

  <footer class="border-t border-[var(--border)]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 text-[11px] text-[var(--ink-3)] font-mono flex flex-wrap gap-x-4 gap-y-1">
      <span>IOTA Train at Home · SN9</span>
      <span>数据经 AES-256 加密存储于仓库，浏览器本地解密</span>
    </div>
  </footer>

<script>
/* ===== 主题（与旧版同一套 localStorage 键） ===== */
var THEME_KEY = 'iota_dashboard_theme';
function setTheme(name, save) {
  document.documentElement.setAttribute('data-theme', name);
  if (save !== false) { try { localStorage.setItem(THEME_KEY, name); } catch (e) {} }
  ['light', 'dark', 'midnight-neon'].forEach(function (t) {
    var btn = document.getElementById('theme-btn-' + t);
    if (!btn) return;
    btn.className = 'px-2.5 py-1 rounded-md transition-all flex items-center gap-1 ' + (t === name
      ? 'bg-[var(--card)] text-[var(--ink)] font-semibold shadow-sm border border-[var(--border)]'
      : 'text-[var(--ink-2)] hover:text-[var(--ink)]');
  });
}
(function initTheme() {
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  setTheme(['light', 'dark', 'midnight-neon'].indexOf(saved) >= 0 ? saved : 'light', false);
})();

/* ===== LIVE 实时遥测 ===== */
(function () {
  var DATA_URL = 'https://raw.githubusercontent.com/oakvillechen/iota-train-at-home-watchdog/main/data/miners.json';
  var POLL_MS = 15000;
  var CONFIG_KEY = 'iota_watchdog_dashboard_config';
  var lastData = null;

  function $(id) { return document.getElementById(id); }
  function fmt(n) { if (n === null || n === undefined || isNaN(n)) return '--'; return Number(n).toLocaleString('en-US'); }
  function pct(f) { if (f === null || f === undefined) return '--'; return (f * 100).toFixed(3) + '%'; }
  function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function savedConfig() { try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); } catch (e) { return {}; } }
  function initialPasswords() {
    var out = [];
    var saved = savedConfig().password;
    if (saved) out.push(saved);
    if (out.indexOf('iota2026') < 0) out.push('iota2026');
    return out;
  }
  var pwdCandidates = initialPasswords();
  function persistPassword(pwd) {
    try {
      var cfg = savedConfig(); cfg.password = pwd;
      localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
    } catch (e) {}
  }

  /* AES-256-CBC + PBKDF2-SHA256(100k) — 与仓库 data 的加密方案一致 */
  async function decryptPacket(packet, pwd) {
    var enc = new TextEncoder();
    function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    var km = await crypto.subtle.importKey('raw', enc.encode(pwd), { name: 'PBKDF2' }, false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(packet.salt), iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-CBC', length: 256 }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(packet.iv) }, key, b64(packet.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function nextSettlementMs() {
    var TZ = 'America/Toronto';
    var dtf = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    function parts(ms) { var p = {}; dtf.formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; }); return p; }
    function zoned(y, mo, d, h, mi) {
      var desired = Date.UTC(y, mo - 1, d, h, mi, 0), guess = desired;
      for (var i = 0; i < 3; i++) {
        var p = parts(guess);
        var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
        var diff = desired - asUTC; guess += diff; if (diff === 0) break;
      }
      return guess;
    }
    var now = Date.now();
    var p = parts(now);
    var t = zoned(+p.year, +p.month, +p.day, 20, 0);
    if (t <= now) {
      var nx = new Date(Date.UTC(+p.year, +p.month - 1, +p.day) + 86400000);
      t = zoned(nx.getUTCFullYear(), nx.getUTCMonth() + 1, nx.getUTCDate(), 20, 0);
    }
    return t;
  }
  function tickCountdown() {
    var el = $('live-countdown'); if (!el) return;
    var diff = Math.max(0, Math.floor((nextSettlementMs() - Date.now()) / 1000));
    var h = Math.floor(diff / 3600), m = Math.floor((diff % 3600) / 60), s = diff % 60;
    el.textContent = [h, m, s].map(function (x) { return String(x).padStart(2, '0'); }).join(':');
  }

  var TIER_ORDER = { Gold: 3, Silver: 2, Bronze: 1, Iron: 0 };
  var TIER_COLOR = { Gold: '#d97706', Silver: '#64748b', Bronze: '#b45309', Iron: '#6b7280' };
  function tierName(t) {
    var m = /Gold|Silver|Bronze|Iron/i.exec(t || '');
    return m ? m[0].charAt(0).toUpperCase() + m[0].slice(1).toLowerCase() : '';
  }
  function runCard(r, here) {
    var tn = tierName(r.tier);
    var color = TIER_COLOR[tn] || 'var(--ink-3)';
    var markers = (here || []).map(function (h) {
      var c = h.stalled ? 'var(--amber)' : 'var(--indigo)';
      return '<span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" style="background:color-mix(in srgb,' + c + ' 18%, transparent);color:' + c + '">' + esc(h.label) + ' 在此</span>';
    }).join(' ');
    return '<div class="p-3 rounded-xl bg-[var(--card-sub)] border border-[var(--border)]">'
      + '<div class="flex items-center justify-between gap-2">'
      + '<span class="font-mono text-[13px] font-semibold text-[var(--ink)]">' + esc((r.run_id || '').replace('-tah', '')) + '</span>'
      + '<span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold whitespace-nowrap" style="background:color-mix(in srgb,' + color + ' 16%, transparent);color:' + color + '">' + esc(r.tier || '') + '</span>'
      + '</div>'
      + '<div class="mt-1.5 flex items-baseline gap-1"><span class="font-mono text-[15px] text-[var(--ink)]">' + fmt(r.num_miners) + '</span><span class="text-[10px] text-[var(--ink-3)]">台矿工</span>'
      + (r.is_default ? '<span class="text-[10px] text-[var(--ink-3)] ml-1">· 默认</span>' : '')
      + '</div>'
      + (markers ? '<div class="mt-1.5 flex flex-wrap gap-1">' + markers + '</div>' : '')
      + '</div>';
  }

  var STATUS_TXT = { producing: '产出中', stalled: '已停滞', out: '不在 run 内', unknown: '未知' };
  var STATUS_COLOR = { producing: 'var(--green)', stalled: 'var(--amber)', out: 'var(--red)', unknown: 'var(--ink-3)' };
  function machineRow(m) {
    var c = STATUS_COLOR[m.status] || 'var(--ink-3)';
    var badge = '<span class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold whitespace-nowrap" style="background:color-mix(in srgb,' + c + ' 16%, transparent);color:' + c + '">' + (STATUS_TXT[m.status] || m.status) + '</span>';
    var detail;
    if (m.status === 'out') {
      detail = '不在任何 run' + (m.last_run_id ? ' · 上次 ' + esc(m.last_run_id.replace('-tah', '')) + ' · 历史最高 ' + fmt(m.series_max) + ' tokens' : '');
    } else if (m.run_id) {
      detail = esc(m.run_id.replace('-tah', '')) + ' · ' + fmt(m.tokens) + ' tokens · 占比 ' + pct(m.frac)
        + (m.rank ? ' · 排名 ' + fmt(m.rank) + '/' + fmt(m.num_miners) : '')
        + (m.pace_per_hour ? ' · ' + fmt(m.pace_per_hour) + '/h' : '')
        + ' · 今日 ' + fmt(m.today_tokens)
        + (m.status === 'stalled' && m.flat_minutes ? ' · 已停 ' + m.flat_minutes + ' 分钟' : '');
    } else {
      detail = STATUS_TXT[m.status] || '未知';
    }
    return '<div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 px-3 py-2">'
      + '<span class="font-bold text-[13px] text-[var(--ink)]">' + esc(m.label) + '</span>'
      + '<span class="text-[11px] font-mono text-[var(--ink-3)]">…' + esc(m.hotkey_tail || '') + '</span>'
      + badge
      + '<span class="text-[12px] text-[var(--ink-2)]">' + detail + '</span>'
      + '</div>';
  }

  function render(data) {
    lastData = data;
    $('live-loading').classList.add('hidden');
    $('live-locked').classList.add('hidden');
    $('live-body').classList.remove('hidden');
    var hereByRun = {};
    (data.machines || []).forEach(function (m) {
      if (m.run_id) { (hereByRun[m.run_id] = hereByRun[m.run_id] || []).push({ label: m.label, stalled: m.status === 'stalled' }); }
    });
    var runsSorted = (data.runs || []).slice().sort(function (x, y) {
      var d = (TIER_ORDER[tierName(y.tier)] || 0) - (TIER_ORDER[tierName(x.tier)] || 0);
      return d !== 0 ? d : (y.num_miners || 0) - (x.num_miners || 0);
    });
    $('live-cards').innerHTML = runsSorted.length
      ? runsSorted.map(function (r) { return runCard(r, hereByRun[r.run_id] || []); }).join('')
      : '<div class="text-[12px] text-[var(--ink-3)]">暂无 run 数据</div>';
    $('live-machines').innerHTML = (data.machines || []).map(machineRow).join('');
    var gen = data.generated_at ? new Date(data.generated_at) : null;
    $('live-updated').textContent = gen ? gen.toLocaleTimeString('en-CA', { timeZone: 'America/Toronto', hour12: false }) : '—';
  }

  function showLocked(hint) {
    if (lastData) return;
    $('live-loading').classList.add('hidden');
    $('live-body').classList.add('hidden');
    $('live-locked').classList.remove('hidden');
    if (hint) $('live-lock-hint').textContent = hint;
  }

  async function loadLive() {
    try {
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var timer = ctl ? setTimeout(function () { ctl.abort(); }, 10000) : null;
      var r = await fetch(DATA_URL + '?_t=' + Date.now(), ctl ? { signal: ctl.signal } : {});
      if (timer) clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var packet = await r.json();
      var data = null;
      if (packet && packet.machines && packet.runs) {
        data = packet; // 明文（本地测试）
      } else {
        for (var i = 0; i < pwdCandidates.length; i++) {
          try { data = await decryptPacket(packet, pwdCandidates[i]); break; } catch (e) { data = null; }
        }
      }
      if (!data || !data.machines) { showLocked('密码不对，或仓库 Secrets 里的 TELEMETRY_PASSWORD 与页面密码不一致。'); return; }
      render(data);
      var dot = $('live-dot'); if (dot) dot.style.background = 'var(--green)';
    } catch (e) {
      var dot2 = $('live-dot'); if (dot2) dot2.style.background = 'var(--amber)';
      if (!lastData) {
        $('live-loading').textContent = '实时遥测拉取失败，15 秒后重试…';
        showLocked('暂时拉不到数据；若你的页面密码与仓库 Secret 一致，也可在此重新输入确认。');
      }
    }
  }

  $('live-unlock-btn').addEventListener('click', function () {
    var v = $('live-pwd').value.trim();
    if (!v) return;
    pwdCandidates = [v];
    persistPassword(v);
    $('live-locked').classList.add('hidden');
    $('live-loading').classList.remove('hidden');
    $('live-loading').textContent = '正在拉取实时遥测…';
    loadLive();
  });
  $('live-pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('live-unlock-btn').click(); });

  tickCountdown();
  setInterval(tickCountdown, 1000);
  loadLive();
  setInterval(loadLive, POLL_MS);
})();
</script>
</body>
</html>
