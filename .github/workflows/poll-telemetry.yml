name: Poll Miner Telemetry

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [poll-telemetry]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-telemetry
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build config from secrets
        env:
          M3_HK: ${{ secrets.M3_HOTKEY }}
          M1_HK: ${{ secrets.M1_HOTKEY }}
          UNLOCK_KEY: ${{ secrets.TELEMETRY_PASSWORD }}
        run: |
          node -e "require('fs').writeFileSync('scripts/telemetry.config.json', JSON.stringify({m3:process.env.M3_HK||'', m1:process.env.M1_HK||'', unlock:process.env.UNLOCK_KEY||''}))"

      - name: Poll official API and write encrypted telemetry
        run: node scripts/poll-telemetry.mjs

      - name: Publish telemetry snapshot (telemetry branch, no history)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f scripts/telemetry.config.json
          python3 iota_cluster_sync.py publish data/telemetry/miners.json data/telemetry/miners.json
